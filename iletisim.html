<main id="main">

  <!-- Tek bolum: "Bize Ulaşın" ve uc alanlik form. Slogan cumlesi, buyuk
       e-posta blogu, iletisim detay satirlari ve harita kaldirildi — e-posta,
       telefon ve Instagram alttaki siyah blokta zaten var, ikisi ust uste
       tekrar ediyordu. Sayfa bir ekrana sigiyor, siyah blok scroll gerektirmeden
       gorunuyor (bkz. css/main.css icindeki [data-page="contact"] kurallari). -->
  <section class="contact-head shell">
    <!-- Ustteki "İletişim" etiketi kaldirildi: menude zaten secili, sayfa
         basligi da ayni seyi soyluyordu. -->
    <h1 class="h1"><span data-reveal-mask><span data-i18n="contact.title">Bize Ulaşın</span></span></h1>

    <form class="form-grid" id="enquiry" style="margin-top:clamp(1.75rem,4vh,2.75rem)" novalidate>
      <label class="field" data-reveal>
        <span class="label" data-i18n="f.email">E-posta</span>
        <input type="email" name="email" required autocomplete="email" data-i18n-ph="f.email.p" placeholder="siz@ornek.com">
      </label>

      <label class="field" data-reveal data-reveal-delay="1">
        <span class="label" data-i18n="f.phone">Telefon</span>
        <input type="tel" name="phone" autocomplete="tel" data-i18n-ph="f.phone.p" placeholder="+90 ___ ___ __ __">
      </label>

      <label class="field is-full" data-reveal>
        <span class="label" data-i18n="f.msg">Mesajınız</span>
        <textarea name="message" rows="3" required data-i18n-ph="f.msg.p" placeholder="Kısaca yazın."></textarea>
      </label>

      <div class="is-full" data-reveal>
        <button class="btn" type="submit">
          <span data-i18n="f.submit">Gönder</span>
          <svg viewBox="0 0 24 8" width="24" aria-hidden="true" style="overflow:visible"><line x1="0" y1="4" x2="20" y2="4" stroke="currentColor" stroke-width="1"/><polyline points="16,0.5 20,4 16,7.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <p class="small form-note" id="formNote" hidden></p>
      </div>
    </form>
  </section>

</main>
